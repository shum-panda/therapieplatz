<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F6EFE4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1A17" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Therapieplatz">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Deine Therapieplatzsuche in Berlin, Schritt für Schritt. Alle Daten bleiben auf deinem Gerät.">
<title>Therapieplatz</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Ruhig und warm: Papierton, Ton-Rot als Akzent, Salbei für Erledigtes */
:root {
  --bg: #F6EFE4;
  --bg-deep: #EFE4D4;
  --surface: #FFFBF5;
  --ink: #2E2723;
  --muted: #74675C;
  --line: #E6D9C6;
  --accent: #A65A3C;
  --accent-ink: #FFF8F1;
  --accent-soft: #F5E2D6;
  --sage: #5E7A5B;
  --sage-soft: #E2EADB;
  --sky: #4F6F93;
  --sky-soft: #E1E9F1;
  --honey: #946A12;
  --honey-soft: #F7EACB;
  --plum: #7A5A86;
  --plum-soft: #EDE3F0;
  --rose: #9C5560;
  --rose-soft: #F4E1E2;
  --sand: #8A7B6C;
  --sand-soft: #EEE6DA;
  --shadow: 0 1px 2px rgba(80,55,30,.06), 0 6px 20px rgba(80,55,30,.07);
  --r: 18px;
  --f-display: "Fraunces", Georgia, "Times New Roman", serif;
  --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1E1A17; --bg-deep: #26211D; --surface: #2A2420; --ink: #F1E8DE; --muted: #B5A797; --line: #3D352F;
    --accent: #E39A78; --accent-ink: #2A1A12; --accent-soft: #43291F;
    --sage: #A8C3A1; --sage-soft: #263124; --sky: #A3BEDC; --sky-soft: #1F2A36;
    --honey: #E6C273; --honey-soft: #3A2F17; --plum: #CDB0D8; --plum-soft: #33283A;
    --rose: #E3A3AC; --rose-soft: #3D2629; --sand: #C2B3A2; --sand-soft: #332C26;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1E1A17; --bg-deep: #26211D; --surface: #2A2420; --ink: #F1E8DE; --muted: #B5A797; --line: #3D352F;
  --accent: #E39A78; --accent-ink: #2A1A12; --accent-soft: #43291F;
  --sage: #A8C3A1; --sage-soft: #263124; --sky: #A3BEDC; --sky-soft: #1F2A36;
  --honey: #E6C273; --honey-soft: #3A2F17; --plum: #CDB0D8; --plum-soft: #33283A;
  --rose: #E3A3AC; --rose-soft: #3D2629; --sand: #C2B3A2; --sand-soft: #332C26;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55;
  -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none;
  padding-top: env(safe-area-inset-top, 0px);
}
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; margin: 0; letter-spacing: -0.01em; text-wrap: balance; line-height: 1.2; }
h1 { font-size: 28px; }
h2 { font-size: 21px; }
h3 { font-size: 17px; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.tiny { font-size: 12.5px; }
.nowrap { white-space: nowrap; }
.pre { white-space: pre-wrap; overflow-wrap: anywhere; }

/* ---------- Grundgerüst ---------- */
.shell { max-width: 1120px; margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom, 0px)); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0 10px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; min-width: 0; }
.brand svg { flex: none; }
.brand b { font-family: var(--f-display); font-weight: 600; font-size: 20px; letter-spacing: -0.01em; }
.top-actions { display: flex; gap: 8px; align-items: center; }
.chip-btn { text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px 5px 5px; cursor: pointer; max-width: 170px; }
.chip-btn .av { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; }
.chip-btn span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: 15px; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--ink); text-decoration: none; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(6, 1fr);
  background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); }
.tabs a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 0 3px; text-decoration: none; color: var(--muted); font-size: 11.5px; font-weight: 600; border-radius: 12px; position: relative; }
.tabs a svg { width: 23px; height: 23px; }
.tabs a.on { color: var(--accent); }
.tabs a.on::before { content: ""; position: absolute; top: 1px; width: 40px; height: 30px; border-radius: 12px; background: var(--accent-soft); z-index: -1; }
.tabs .badge { position: absolute; top: 0; right: calc(50% - 22px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: 11px; line-height: 17px; text-align: center; }

@media (min-width: 900px) {
  .shell { display: grid; grid-template-columns: 210px 1fr; gap: 0 36px; padding-bottom: 48px; }
  .top { grid-column: 1 / -1; padding-top: 22px; }
  .tabs { position: sticky; top: 16px; align-self: start; display: flex; flex-direction: column; gap: 4px; background: none; backdrop-filter: none; border: 0; padding: 8px 0; }
  .tabs a { flex-direction: row; gap: 12px; font-size: 15.5px; padding: 10px 14px; color: var(--ink); }
  .tabs a.on { background: var(--accent-soft); }
  .tabs a.on::before { display: none; }
  .tabs .badge { position: static; margin-left: auto; }
  main { min-width: 0; }
}

/* ---------- Bausteine ---------- */
.view { display: flex; flex-direction: column; gap: 18px; padding-top: 6px; }
.head { display: flex; flex-direction: column; gap: 6px; }
.head p { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); }
.card.flat { box-shadow: none; }
.card.soft { background: var(--bg-deep); border-color: transparent; box-shadow: none; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.grid2 { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.sec-title { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.sec-title h2 { font-size: 19px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 14px; border: 1px solid transparent;
  background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer; text-decoration: none; line-height: 1.2; text-align: center; }
.btn:hover { filter: brightness(1.05); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.soft { background: var(--accent-soft); color: var(--accent); }
.btn.sage { background: var(--sage); color: #fff; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 14.5px; border-radius: 11px; }
.btn.danger { background: transparent; color: var(--rose); border-color: var(--rose-soft); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font-size: 14px; font-weight: 700; color: var(--muted); }
.field small { color: var(--muted); font-size: 13px; }
input[type=text], input[type=tel], input[type=email], input[type=url], input[type=date], input[type=time], input[type=number], input[type=search], select, textarea {
  width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); border-color: var(--accent); }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.check input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap; background: var(--sand-soft); color: var(--sand); }
.st-neu { background: var(--sand-soft); color: var(--sand); }
.st-angefragt { background: var(--sky-soft); color: var(--sky); }
.st-rueckruf { background: var(--honey-soft); color: var(--honey); }
.st-warteliste { background: var(--plum-soft); color: var(--plum); }
.st-absage { background: var(--rose-soft); color: var(--rose); }
.st-erstgespraech { background: var(--sage-soft); color: var(--sage); }
.st-platz { background: var(--sage); color: #fff; }
.tag { display: inline-block; padding: 1px 8px; border-radius: 7px; font-size: 12.5px; font-weight: 700; background: var(--bg-deep); color: var(--muted); }
.tag.tp { background: var(--accent-soft); color: var(--accent); }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; margin: 0 -16px; padding-inline: 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 14px; cursor: pointer; color: var(--ink); }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .n { opacity: .6; margin-left: 4px; font-weight: 600; }

.empty { text-align: center; padding: 28px 18px; color: var(--muted); }
.empty h3 { color: var(--ink); margin-bottom: 6px; }

/* Start */
.hello h1 { font-size: 30px; }
.hello p { color: var(--muted); max-width: 52ch; margin-top: 6px; }
.next { background: linear-gradient(135deg, var(--accent-soft), color-mix(in srgb, var(--honey-soft) 70%, var(--accent-soft))); border: 0; }
.next .label { font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.next h2 { margin: 4px 0 6px; }
.next ul { margin: 8px 0 0; padding-left: 18px; }
.next li + li { margin-top: 4px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 6px; text-align: center; }
.stat b { display: block; font-family: var(--f-display); font-size: 26px; font-weight: 600; line-height: 1.1; }
.stat span { font-size: 12.5px; color: var(--muted); font-weight: 700; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.step { display: grid; grid-template-columns: 34px 1fr; gap: 0 14px; position: relative; padding-bottom: 14px; }
.step:not(:last-child)::before { content: ""; position: absolute; left: 16px; top: 34px; bottom: 0; width: 2px; background: var(--line); }
.step .dot { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: var(--surface); border: 2px solid var(--line); color: var(--muted); z-index: 1; font-size: 15px; }
.step.done .dot { background: var(--sage); border-color: var(--sage); color: #fff; }
.step.now .dot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 0 0 6px var(--accent-soft); }
.step details { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.step.now details { border-color: var(--accent); box-shadow: var(--shadow); }
.step summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.step summary::-webkit-details-marker { display: none; }
.step summary h3 { font-size: 16.5px; }
.step summary .hint { font-size: 12.5px; font-weight: 800; color: var(--accent); white-space: nowrap; }
.step.done summary .hint { color: var(--sage); }
.step .body { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; font-size: 15.5px; }
.links { display: flex; flex-direction: column; gap: 8px; }
.links a { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--ink); font-weight: 700; }
.links a small { display: block; font-weight: 400; color: var(--muted); }
.note { font-size: 14px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 12px; }

/* Liste */
.tlist { display: flex; flex-direction: column; gap: 10px; }
.tcard { display: grid; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; cursor: pointer; text-align: left; width: 100%; color: inherit; }
.tcard:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.tcard .name { overflow-wrap: anywhere; font-weight: 800; font-size: 16.5px; line-height: 1.3; }
.tcard .meta { font-size: 14px; color: var(--muted); }
.tcard .tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.filters { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.filters select { min-height: 40px; padding: 6px 8px; font-size: 14px; }
.search { position: relative; }

/* Detail */
.dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 15px; }
.dl dt { color: var(--muted); font-weight: 700; }
.dl dd { margin: 0; overflow-wrap: anywhere; }
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.timeline li { display: grid; grid-template-columns: 36px 1fr; gap: 10px; }
.timeline .ic { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--bg-deep); color: var(--muted); }
.timeline .ic.in { background: var(--sky-soft); color: var(--sky); }
.timeline .when { font-size: 13px; color: var(--muted); }
.timeline .txt { margin-top: 4px; font-size: 14.5px; background: var(--bg-deep); border-radius: 12px; padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.statusbar { display: flex; flex-wrap: wrap; gap: 6px; }
.statusbar button { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; font-weight: 700; font-size: 13.5px; cursor: pointer; color: var(--ink); }
.statusbar button.on { border-color: transparent; }

/* Anrufen */
.callrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 14px 16px; }
.callrow + .callrow { border-top: 1px solid var(--line); }
.callrow .who { font-weight: 800; overflow-wrap: anywhere; }
.callrow .when { font-size: 14px; color: var(--muted); }
.callrow .count { font-weight: 800; color: var(--sage); }
.callrow .count.later { color: var(--honey); }
.calllist { padding: 0; overflow: hidden; }
.btn.call { background: var(--sage); color: #fff; border-radius: 999px; min-width: 112px; }
.live { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--sage); margin-right: 6px; box-shadow: 0 0 0 4px var(--sage-soft); animation: pulse 2s infinite; vertical-align: 1px; }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px transparent; } }
@media (prefers-reduced-motion: reduce) { .live { animation: none; } }
.plan { list-style: none; margin: 0; padding: 0; }
.plan li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.plan li:last-child { border-bottom: 0; }
.plan .t { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 14.5px; }
.plan li.past { opacity: .45; }
.plan li.now .t { color: var(--sage); }

/* Mails */
.seg { display: flex; background: var(--bg-deep); padding: 4px; border-radius: 14px; gap: 4px; }
.seg button { flex: 1; border: 0; background: none; padding: 9px 6px; border-radius: 11px; font-weight: 700; cursor: pointer; color: var(--muted); font-size: 14.5px; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.pick { display: flex; flex-direction: column; }
.pick label { display: grid; grid-template-columns: 24px 1fr auto; gap: 10px; align-items: center; padding: 11px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
.pick label:last-child { border-bottom: 0; }
.pick input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; }
.preview { background: var(--bg-deep); border-radius: 14px; padding: 12px 14px; font-size: 14.5px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 320px; overflow: auto; }
[data-queue] .preview { max-height: 230px; }
.progress { height: 8px; background: var(--bg-deep); border-radius: 4px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .3s; }
.ph { display: flex; flex-wrap: wrap; gap: 6px; }
.ph button { border: 1px dashed var(--line); background: var(--surface); border-radius: 8px; padding: 3px 8px; font-size: 13px; cursor: pointer; color: var(--ink); font-family: ui-monospace, Consolas, monospace; }

/* Protokoll */
.ptable { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.ptable th { text-align: left; font-size: 12.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); }
.ptable td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.ptable tr[data-act] { cursor: pointer; }
.ptable tr[data-act]:hover td { background: var(--bg-deep); }
@media (max-width: 699px) {
  .ptable thead { display: none; }
  .ptable, .ptable tbody, .ptable tr, .ptable td { display: block; }
  .ptable tr { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 12px 2px; border-bottom: 1px solid var(--line); }
  .ptable td { border: 0; padding: 0; }
  .ptable td.c-date { grid-column: 1; font-size: 13px; color: var(--muted); order: 1; }
  .ptable td.c-kanal { grid-column: 2; font-size: 13px; color: var(--muted); order: 2; text-align: right; }
  .ptable td.c-name { grid-column: 1 / -1; font-weight: 800; order: 3; }
  .ptable td.c-res { grid-column: 1 / -1; order: 4; }
  .ptable td.c-wait { grid-column: 1 / -1; order: 5; font-size: 13.5px; color: var(--muted); }
  .ptable td.c-wait:empty { display: none; }
}

/* Antrag */
.checklist { display: flex; flex-direction: column; gap: 12px; }
.checklist .check small { display: block; color: var(--muted); font-size: 13.5px; }
.letter { font-family: Georgia, "Times New Roman", serif; font-size: 15px; min-height: 420px; line-height: 1.55; }
.deadline { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--honey-soft); color: var(--honey); font-weight: 700; font-size: 14.5px; }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(40,28,20,.38); z-index: 40; display: flex; align-items: flex-end; justify-content: center; animation: fade .18s ease; }
.sheet { width: 100%; max-width: 620px; max-height: 92vh; max-height: 92dvh; overflow: auto; background: var(--surface); border-radius: 24px 24px 0 0; padding: 10px 18px calc(22px + env(safe-area-inset-bottom, 0px)); animation: up .22s ease; overscroll-behavior: contain; }
.sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 2px auto 12px; }
.sheet h2 { margin-bottom: 4px; }
.sheet .acts { position: sticky; bottom: calc(-22px - env(safe-area-inset-bottom, 0px)); background: var(--surface); padding: 12px 0 0; margin-top: 6px; display: flex; gap: 10px; }
.sheet .acts .btn { flex: 1; }
@media (min-width: 700px) { .scrim { align-items: center; } .sheet { border-radius: 24px; padding-bottom: 22px; } .sheet .acts { bottom: -22px; } }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
.outcomes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.outcomes button { min-height: 54px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer; padding: 8px; color: var(--ink); line-height: 1.25; }
.outcomes button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.zeiten { display: flex; flex-direction: column; gap: 8px; }
.zrow { display: grid; grid-template-columns: 76px 1fr 1fr 40px; gap: 6px; align-items: center; }
.zrow select, .zrow input { min-height: 42px; padding: 6px 8px; }
.zrow button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--muted); }

.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 600; font-size: 15px; max-width: min(92vw, 460px); box-shadow: var(--shadow); animation: up .2s ease; }
@media (min-width: 900px) { .toast { bottom: 28px; } }

.welcome { max-width: 520px; margin: 6vh auto 0; display: flex; flex-direction: column; gap: 18px; }
.welcome h1 { font-size: 34px; }

/* ---------- Druck ---------- */
#print { display: none; }
@media print {
  @page { margin: 18mm 16mm; }
  body { background: #fff; color: #000; padding: 0; }
  body > *:not(#print) { display: none !important; }
  #print { display: block; font-family: Georgia, "Times New Roman", serif; font-size: 11pt; line-height: 1.45; color: #000; }
  #print h1 { font-family: Georgia, serif; font-size: 16pt; margin: 0 0 4pt; }
  #print .meta { margin-bottom: 12pt; font-size: 10pt; }
  #print table { width: 100%; border-collapse: collapse; font-size: 9.5pt; font-family: Arial, Helvetica, sans-serif; }
  #print th, #print td { border: 0.6pt solid #888; padding: 4pt 5pt; text-align: left; vertical-align: top; }
  #print th { background: #eee; }
  #print tr { break-inside: avoid; }
  #print .sum { margin: 10pt 0; font-family: Arial, Helvetica, sans-serif; font-size: 10pt; }
  #print .letter-print { white-space: pre-wrap; font-size: 11pt; }
  #print .foot { margin-top: 16pt; font-size: 9pt; color: #444; }
}

<script>
"use strict";
/* =====================================================================
   Therapieplatz: alles bleibt im Browser (localStorage). Kein Server.
   ===================================================================== */

// ---------- Hilfsfunktionen ----------
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s ?? "").replace(/[&<>"'`]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;", "`": "&#96;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = (n) => String(n).padStart(2, "0");
const TAGE = ["", "Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
const TAGE_LANG = ["", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];
const wd = (d) => ((d.getDay() + 6) % 7) + 1; // 1 = Montag
const toMin = (hhmm) => { const m = /^(\d{1,2}):(\d{2})$/.exec(hhmm || ""); return m ? +m[1] * 60 + +m[2] : null; };
const fromMin = (m) => pad(Math.floor(m / 60)) + ":" + pad(m % 60);
const nowMin = (d = new Date()) => d.getHours() * 60 + d.getMinutes();
const isoDate = (d = new Date()) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const fmtDate = (iso) => { if (!iso) return ""; const d = new Date(iso.length <= 10 ? iso + "T12:00" : iso); return isNaN(d) ? "" : pad(d.getDate()) + "." + pad(d.getMonth() + 1) + "." + d.getFullYear(); };
const fmtTime = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const fmtDur = (min) => min < 60 ? min + " Min" : Math.floor(min / 60) + " Std" + (min % 60 ? " " + (min % 60) + " Min" : "");
const addDays = (iso, n) => { const d = new Date(iso + "T12:00"); d.setDate(d.getDate() + n); return isoDate(d); };
const addMonths = (iso, n) => { const d = new Date(iso + "T12:00"); d.setMonth(d.getMonth() + n); return isoDate(d); };
const daysBetween = (a, b) => Math.round((new Date(b + "T12:00") - new Date(a + "T12:00")) / 86400000);
const telHref = (t) => "tel:" + String(t || "").replace(/[^\d+]/g, "");
const safeUrl = (u) => { u = String(u || "").trim(); if (!u) return ""; if (/^www\./i.test(u)) u = "https://" + u; return /^https?:\/\//i.test(u) ? u : ""; };
const plural = (n, one, many) => n + " " + (n === 1 ? one : many);

const ICON = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/></svg>',
  list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M3 18.5c.8-2.6 2.8-4 5-4s4.2 1.4 5 4M15 7h6M15 11h6M16 15h5"/></svg>',
  phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6.6 3.5h2.6l1.4 4.1-2 1.4a12 12 0 0 0 6.4 6.4l1.4-2 4.1 1.4v2.6a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4.6 5.7a2 2 0 0 1 2-2.2z"/></svg>',
  mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><path d="m4.5 7 7.5 6 7.5-6"/></svg>',
  log: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h7l4 4V19a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 19V5"/><path d="M9.5 11h5M9.5 14.5h5M9.5 18h3"/></svg>',
  doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20.5V5a1.5 1.5 0 0 1 1.5-1.5H15l4 4v13"/><path d="m9 13 2 2 4-4.5"/></svg>',
  gear: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>',
  out: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  note: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 19h4L19.5 8.5a2.1 2.1 0 0 0-3-3L6 16z"/></svg>',
  inbox: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 13.5 6.5 5h11l2.5 8.5V19H4z"/><path d="M4 13.5h5l1 2h4l1-2h5"/></svg>',
};
const LOGO = '<svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="#F1E2CD"/><circle cx="32" cy="31" r="14" fill="#C8714E"/><path d="M0 44c10-7 20-9 32-6s22 2 32-4v30H0z" fill="#86A07F"/><path d="M0 52c12-5 24-5 36-2s20 2 28-1v15H0z" fill="#5F7C5E"/></svg>';

// ---------- Fachliche Konstanten ----------
const STATUS = {
  neu: "Neu", angefragt: "Angefragt", rueckruf: "Rückruf erwartet", warteliste: "Warteliste",
  absage: "Absage", erstgespraech: "Erstgespräch vereinbart", platz: "Platz",
};
const STATUS_ORDER = ["neu", "angefragt", "rueckruf", "warteliste", "erstgespraech", "platz", "absage"];
const VERFAHREN = { TP: "Tiefenpsychologisch fundiert", VT: "Verhaltenstherapie", AP: "Analytisch", ST: "Systemisch" };
const VERFAHREN_LANG = { TP: "tiefenpsychologisch fundierte Psychotherapie", VT: "Verhaltenstherapie", AP: "analytische Psychotherapie", ST: "systemische Therapie" };
const TYP = { kasse: "Kassensitz", privat: "Privatpraxis", "": "Unklar" };
const BEZIRKE = ["Charlottenburg-Wilmersdorf", "Friedrichshain-Kreuzberg", "Lichtenberg", "Marzahn-Hellersdorf", "Mitte", "Neukölln", "Pankow", "Reinickendorf", "Spandau", "Steglitz-Zehlendorf", "Tempelhof-Schöneberg", "Treptow-Köpenick"];
const ORTSTEILE = {
  "Charlottenburg-Wilmersdorf": ["Charlottenburg", "Wilmersdorf", "Westend", "Grunewald", "Halensee", "Schmargendorf"],
  "Friedrichshain-Kreuzberg": ["Friedrichshain", "Kreuzberg"],
  "Lichtenberg": ["Lichtenberg", "Friedrichsfelde", "Karlshorst", "Hohenschönhausen", "Rummelsburg", "Fennpfuhl"],
  "Marzahn-Hellersdorf": ["Marzahn", "Hellersdorf", "Biesdorf", "Kaulsdorf", "Mahlsdorf"],
  "Mitte": ["Mitte", "Moabit", "Wedding", "Gesundbrunnen", "Tiergarten", "Hansaviertel"],
  "Neukölln": ["Neukölln", "Britz", "Buckow", "Rudow", "Gropiusstadt"],
  "Pankow": ["Pankow", "Prenzlauer Berg", "Weißensee", "Niederschönhausen", "Heinersdorf", "Französisch Buchholz"],
  "Reinickendorf": ["Reinickendorf", "Tegel", "Wittenau", "Hermsdorf", "Frohnau", "Waidmannslust"],
  "Spandau": ["Spandau", "Staaken", "Siemensstadt", "Haselhorst"],
  "Steglitz-Zehlendorf": ["Steglitz", "Zehlendorf", "Dahlem", "Lichterfelde", "Lankwitz", "Wannsee", "Nikolassee"],
  "Tempelhof-Schöneberg": ["Tempelhof", "Schöneberg", "Friedenau", "Mariendorf", "Marienfelde", "Lichtenrade"],
  "Treptow-Köpenick": ["Treptow", "Köpenick", "Adlershof", "Baumschulenweg", "Johannisthal", "Friedrichshagen", "Oberschöneweide", "Niederschöneweide", "Plänterwald"],
};
// Ergebnisse eines Kontakts. status: "touch" hebt nur "Neu" auf "Angefragt"
const RES = {
  gesendet: { label: "E-Mail gesendet", status: "touch" },
  nicht_erreicht: { label: "Nicht erreicht", status: "touch" },
  ab: { label: "Anrufbeantworter", status: "touch" },
  besetzt: { label: "Besetzt", status: "touch" },
  antwort: { label: "Antwort / Info", status: "touch", reply: true },
  rueckruf: { label: "Rückruf vereinbart", status: "rueckruf", reply: true },
  warteliste: { label: "Warteliste", status: "warteliste", reply: true },
  absage: { label: "Absage", status: "absage", reply: true },
  termin: { label: "Termin / Erstgespräch", status: "erstgespraech", reply: true },
  platz: { label: "Platz zugesagt", status: "platz", reply: true },
  notiz: { label: "Notiz", status: null },
};
const CALL_RES = ["nicht_erreicht", "ab", "besetzt", "absage", "warteliste", "rueckruf", "termin"];
const KANAL = { telefon: "Telefon", email: "E-Mail", brief: "Brief/Post", persoenlich: "Persönlich", sonstig: "Sonstiges" };
const FOLLOW_DAYS = 7;

const DEFAULT_TEMPLATES = () => [
  { id: "t-erst", name: "Erstanfrage Kassenplatz", subject: "Anfrage Therapieplatz ({verfahren})",
    body: "{anrede},\n\nich suche einen Platz für eine {verfahren} und möchte fragen, ob Sie in absehbarer Zeit einen Therapieplatz frei haben oder mich auf Ihre Warteliste setzen können.\n\nIch bin bei der {kasse} versichert. {ptv11}\n{dringlichkeit}\n\nZu meiner zeitlichen Verfügbarkeit: {verfuegbarkeit}\n\nSie erreichen mich per E-Mail oder telefonisch unter {meineTelefon}.\n\nVielen Dank und freundliche Grüße\n{meinName}" },
  { id: "t-privat", name: "Anfrage Privatpraxis (Kostenerstattung)", subject: "Anfrage Therapieplatz über Kostenerstattung",
    body: "{anrede},\n\nich suche einen Platz für eine {verfahren}. Bei Praxen mit Kassensitz habe ich trotz vieler Anfragen bisher keinen Platz in absehbarer Zeit gefunden. Deshalb möchte ich bei meiner Krankenkasse ({kasse}) eine Kostenerstattung beantragen.\n\nHätten Sie einen Platz frei und wären Sie bereit, mich im Rahmen der Kostenerstattung zu behandeln? {ptv11}\n{dringlichkeit}\n\nZu meiner zeitlichen Verfügbarkeit: {verfuegbarkeit}\n\nTelefonisch erreichen Sie mich unter {meineTelefon}.\n\nVielen Dank und freundliche Grüße\n{meinName}" },
  { id: "t-nach", name: "Nachfassen", subject: "Nachfrage: Anfrage Therapieplatz",
    body: "{anrede},\n\nvor einiger Zeit habe ich Ihnen wegen eines Therapieplatzes ({verfahren}) geschrieben. Ich wollte freundlich nachfragen, ob sich bei Ihnen inzwischen etwas ergeben hat oder ob eine Aufnahme auf Ihre Warteliste möglich ist.\n\nIch bin weiterhin bei der {kasse} versichert und zeitlich {verfuegbarkeit}.\n\nVielen Dank und freundliche Grüße\n{meinName}" },
];

function blankData(name) {
  return {
    v: 1,
    ich: { name, vollname: "", geburt: "", adresse: "", telefon: "", email: "", kasse: "", kasseAdresse: "", versNr: "",
      verfahren: "TP", verfuegbarkeit: "", dringlichkeit: "", sprechstundeDatum: "", sprechstundeBei: "",
      ptv11: false, ptv11Datum: "", zeitnah: false, tss: false, weg: "" },
    therapists: [], log: [], templates: DEFAULT_TEMPLATES(),
    antrag: { check: {}, privatTid: "", gestelltAm: "", frist: "", antwort: "", antwortAm: "", widerspruchAm: "", notiz: "", brief: "", widerspruch: "" },
    queue: null, followDone: {},
  };
}

// ---------- Speicher ----------
const LS = "tp1";
let D = null;
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { toast("Speichern hat nicht geklappt. Ist der Speicher voll oder privat?"); return false; } }
function normalize(d) {
  d = d && typeof d === "object" ? d : {};
  const out = Object.assign(blankData(""), d);
  out.ich = Object.assign(blankData("").ich, d.ich || {});
  out.antrag = Object.assign(blankData("").antrag, d.antrag || {});
  out.antrag.check = Object.assign({}, (d.antrag || {}).check || {});
  out.therapists = Array.isArray(d.therapists) ? d.therapists.filter((t) => t && t.id).map(normT) : [];
  out.log = Array.isArray(d.log) ? d.log.filter((l) => l && l.id && l.ts) : [];
  out.templates = Array.isArray(d.templates) && d.templates.length ? d.templates : DEFAULT_TEMPLATES();
  out.followDone = d.followDone && typeof d.followDone === "object" ? d.followDone : {};
  return out;
}
function normT(t) {
  return Object.assign({ id: uid(), name: "", anrede: "", praxis: "", adresse: "", bezirk: "", verfahren: [], typ: "", telefon: "", zeiten: [], email: "", website: "", notizen: "", status: "neu", warteWochen: "", created: new Date().toISOString() }, t, {
    verfahren: Array.isArray(t.verfahren) ? t.verfahren : [], zeiten: Array.isArray(t.zeiten) ? t.zeiten : [],
  });
}
// Genau eine Person pro Gerät: alle Daten liegen unter einem Schlüssel
const KEY = LS + ".daten";
function loadAll() { const raw = lsGet(KEY); D = raw ? normalize(raw) : null; }
function save() { if (D) lsSet(KEY, D); }
function myName() { return (D && (D.ich.name || D.ich.vollname.split(" ")[0])) || ""; }

// ---------- Abgeleitete Werte ----------
const T = (id) => D.therapists.find((t) => t.id === id);
const tName = (t) => t ? (t.name || t.praxis || "Ohne Namen") : "Gelöscht";
const logsFor = (tid) => D.log.filter((l) => l.tid === tid).sort((a, b) => b.ts.localeCompare(a.ts));
const activeT = (t) => !["absage", "platz"].includes(t.status);
function stats() {
  const ts = D.therapists;
  return {
    kontaktiert: ts.filter((t) => t.status !== "neu").length,
    absagen: ts.filter((t) => t.status === "absage").length,
    warte: ts.filter((t) => t.status === "warteliste").length,
    versuche: D.log.filter((l) => l.ergebnis !== "notiz").length,
    erst: ts.filter((t) => t.status === "erstgespraech").length,
    platz: ts.filter((t) => t.status === "platz").length,
  };
}
// Telefonfenster heute: [{t, von, bis, state, mins}]
function windowsToday(d = new Date()) {
  const day = wd(d), n = nowMin(d), out = [];
  for (const t of D.therapists) {
    if (!t.telefon || !activeT(t)) continue;
    for (const z of t.zeiten) {
      if (+z.tag !== day) continue;
      const v = toMin(z.von), b = toMin(z.bis);
      if (v == null || b == null || b <= v) continue;
      out.push({ t, von: v, bis: b, state: n >= b ? "past" : n >= v ? "now" : "later", mins: n >= v ? b - n : v - n });
    }
  }
  return out.sort((a, b) => a.von - b.von || tName(a.t).localeCompare(tName(b.t)));
}
function nextWindow(t, d = new Date()) {
  const n = nowMin(d), day = wd(d);
  for (let off = 0; off < 8; off++) {
    const dd = ((day - 1 + off) % 7) + 1;
    const ws = t.zeiten.filter((z) => +z.tag === dd).map((z) => ({ v: toMin(z.von), b: toMin(z.bis) })).filter((z) => z.v != null && z.b > z.v).sort((a, b) => a.v - b.v);
    for (const w of ws) {
      if (off === 0 && w.b <= n) continue;
      return { off, tag: dd, von: w.v, bis: w.b, now: off === 0 && w.v <= n };
    }
  }
  return null;
}
function nextWindowText(t) {
  const w = nextWindow(t);
  if (!w) return "";
  if (w.now) return "Jetzt erreichbar, noch " + fmtDur(w.bis - nowMin());
  const when = w.off === 0 ? "heute" : w.off === 1 ? "morgen" : TAGE[w.tag];
  return "Telefonzeit " + when + " " + fromMin(w.von) + "–" + fromMin(w.bis);
}
// Nachfassen: letzte gesendete E-Mail ohne spätere Antwort
function followUps() {
  const out = [];
  for (const t of D.therapists) {
    if (!["neu", "angefragt"].includes(t.status)) continue;
    const ls = logsFor(t.id);
    const sent = ls.find((l) => l.ergebnis === "gesendet");
    if (!sent) continue;
    const answered = ls.some((l) => l.ts > sent.ts && RES[l.ergebnis]?.reply);
    if (answered || D.followDone[sent.id]) continue;
    const age = daysBetween(sent.ts.slice(0, 10), isoDate());
    out.push({ t, sent, age, due: age >= FOLLOW_DAYS, dueDate: addDays(sent.ts.slice(0, 10), FOLLOW_DAYS) });
  }
  return out.sort((a, b) => b.age - a.age);
}
function currentStep() {
  const i = D.ich;
  if (D.therapists.some((t) => t.status === "platz" || t.status === "erstgespraech")) return 4;
  if (i.weg === "kostenerstattung" || D.antrag.gestelltAm) return 5;
  if (!i.sprechstundeDatum && !i.ptv11) return 1;
  if (!i.ptv11) return 2;
  return 3;
}

// ---------- Logbuch ----------
function addLog(entry, opts = {}) {
  const t = T(entry.tid);
  const l = Object.assign({ id: "l" + uid(), ts: new Date().toISOString(), kanal: "telefon", ergebnis: "notiz", wochen: "", text: "", tname: tName(t) }, entry);
  D.log.push(l);
  if (t && opts.applyStatus !== false) applyResult(t, l);
  save();
  return l;
}
function applyResult(t, l) {
  const r = RES[l.ergebnis];
  if (!r || !r.status) return;
  if (r.status === "touch") { if (t.status === "neu") t.status = "angefragt"; return; }
  t.status = r.status;
  if (r.status === "warteliste" && l.wochen) t.warteWochen = l.wochen;
}

// ---------- Vorlagen ----------
function anrede(t) {
  if (!t || (!t.name && !t.praxis)) return "Sehr geehrte Damen und Herren";
  const clean = cleanName(t.name || "");
  if (!clean) return "Sehr geehrte Damen und Herren";
  const parts = clean.split(/\s+/);
  const titel = parts.filter((p) => /^(Dr\.|Prof\.)$/i.test(p)).join(" ");
  const last = parts.filter((p) => !/^(Dr\.|Prof\.|med\.|phil\.|rer\.|nat\.)$/i.test(p)).pop() || clean;
  const tt = titel ? titel + " " : "";
  if (t.anrede === "frau") return "Sehr geehrte Frau " + tt + last;
  if (t.anrede === "herr") return "Sehr geehrter Herr " + tt + last;
  return "Guten Tag " + clean;
}
function placeholders(t) {

function cleanName(s) {
  return String(s || "")
    .replace(/(?<![\p{L}])(Dipl\.?\s*-?\s*Psych(?:ol)?\.?(?:\s*\(FH\))?|M\.\s?Sc\.?|B\.\s?Sc\.?|MSc|BSc|M\.\s?A\.|Dipl\.?\s*-?\s*(?:Päd|Soz\.?\s*Päd)\.?)(?![\p{L}])/giu, "")
    .replace(/,.*$/, "")
    .replace(/\b(Psychologische[rn]?|Ärztliche[rn]?)\s+Psychotherapeut(?:in|en)?\b/gi, "")

function parseZeiten(text) {
  const norm = String(text)
    .replace(/Montags?/gi, "Mo").replace(/Dienstags?/gi, "Di").replace(/Mittwochs?/gi, "Mi").replace(/Donnerstags?/gi, "Do")
    .replace(/Freitags?/gi, "Fr").replace(/Samstags?|Sonnabends?/gi, "Sa").replace(/Sonntags?/gi, "So");
  const out = [];
  const D7 = { mo: 1, di: 2, mi: 3, do: 4, fr: 5, sa: 6, so: 7 };
  for (const line of norm.split(/\n/)) {
    if (/fax/i.test(line)) continue;
    const re = /(?<![A-Za-zÄÖÜäöüß])(Mo|Di|Mi|Do|Fr|Sa|So)\.?(?:\s*(?:-|–|—|bis)\s*(Mo|Di|Mi|Do|Fr|Sa|So)\.?)?(?![A-Za-zÄÖÜäöüß])|(?<!\d)(\d{1,2})(?:[:.](\d{2}))?\s*(?:Uhr)?\s*(?:-|–|—|bis)\s*(\d{1,2})(?:[:.](\d{2}))?(?!\d)/g;
    let days = [], used = false, m;
    while ((m = re.exec(line))) {
      if (m[1]) {
        if (used) { days = []; used = false; }
        const a = D7[m[1].toLowerCase()], b = m[2] ? D7[m[2].toLowerCase()] : a;
        for (let d = a; d <= (b >= a ? b : a); d++) if (!days.includes(d)) days.push(d);
      } else if (days.length) {
        const v = +m[3] * 60 + +(m[4] || 0), b = +m[5] * 60 + +(m[6] || 0);
        if (v >= 360 && b <= 1320 && b > v) {
          for (const d of days) if (!out.some((z) => z.tag === d && z.von === fromMin(v))) out.push({ tag: d, von: fromMin(v), bis: fromMin(b) });

function parseText(raw) {
  const text = String(raw || "").replace(/\r/g, "").replace(/ /g, " ");
  const lines = text.split("\n").map((l) => l.trim()).filter(Boolean);
  const r = { name: "", anrede: "", praxis: "", adresse: "", bezirk: "", verfahren: [], typ: "", telefon: "", email: "", website: "", zeiten: [], notizen: "" };
  const email = text.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i);
  if (email) r.email = email[0];
  const web = text.match(/\b(?:https?:\/\/|www\.)[^\s<>"',;]+/i);
  if (web) r.website = web[0].replace(/[).]+$/, "");
  const phoneRe = /(?:\+49[\s\-\/]?|0)(?:\(0\)\s?)?\d{2,5}\)?\s?[\-\/]?\s?\(?\d[\d \-\/]{3,}\d/;
  const telLine = lines.find((l) => /tel|fon|☎/i.test(l) && !/fax/i.test(l) && phoneRe.test(l)) || lines.find((l) => !/fax/i.test(l) && phoneRe.test(l) && !/@/.test(l));
  if (telLine) r.telefon = telLine.match(phoneRe)[0].replace(/\s{2,}/g, " ").trim();
  // Adresse: Zeile mit PLZ (Berlin 10xxx–14xxx), Straße davor oder in derselben Zeile
  const plzIdx = lines.findIndex((l) => /\b1[0-4]\d{3}\s+Berlin\b/i.test(l));
  const streetRe = /(stra(ß|ss)e|str\.|weg|platz|damm|allee|ufer|ring|chaussee|markt|gasse|steig|promenade|zeile|pfad)\b.*\d/i;
  if (plzIdx >= 0) {
    const pl = lines[plzIdx];
    const plz = pl.match(/\b1[0-4]\d{3}\s+Berlin(?:[-\s][A-ZÄÖÜ][\wäöüß-]+)?/)[0];
    const sameLineStreet = pl.slice(0, pl.indexOf(plz.slice(0, 5))).replace(/[,\s]+$/, "");
    const prev = plzIdx > 0 && streetRe.test(lines[plzIdx - 1]) ? lines[plzIdx - 1] : "";
    r.adresse = [sameLineStreet && streetRe.test(sameLineStreet) ? sameLineStreet.replace(/^.*?(?=[A-ZÄÖÜ][\wäöüß.-]*\s*(stra|str\.|weg|platz|damm|allee|ufer|ring|chaussee))/i, "") : prev, plz].filter(Boolean).join(", ");
  } else {
    const st = lines.find((l) => streetRe.test(l) && !phoneRe.test(l));
    if (st) r.adresse = st;
  }
  // Bezirk über Ortsteilnamen
  const hay = text;
  outer: for (const [bez, list] of Object.entries(ORTSTEILE)) {
    for (const o of [bez, ...list]) {
      if (new RegExp("(?<![\\p{L}])" + o.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?![\\p{L}])", "u").test(hay)) { r.bezirk = bez; break outer; }
    }
  }
  if (/tiefenpsych/i.test(text)) r.verfahren.push("TP");
  if (/verhaltensthera/i.test(text)) r.verfahren.push("VT");
  if (/analytisch|psychoanaly/i.test(text)) r.verfahren.push("AP");
  if (/systemisch/i.test(text)) r.verfahren.push("ST");
  if (/nur\s+privat|privatpraxis|selbstzahl|privatpatient|keine\s+kassenzulassung/i.test(text)) r.typ = "privat";
  else if (/kassenzulassung|kassensitz|alle\s+kassen|gesetzlich|gkv|kassenpatient/i.test(text)) r.typ = "kasse";
  r.zeiten = parseZeiten(text);
  // Name
  const skip = (l) => /@|https?:|www\.|\b1[0-4]\d{3}\b|telefon|tel\.|fax|sprechzeit|erreichbar|verfahren|kasse|abrechnung|sprache|termin|^\+?\d/i.test(l) || streetRe.test(l) || l.length > 90;
  const titled = lines.find((l) => !skip(l) && /(\bDr\.|\bProf\.|Dipl\.|M\.\s?Sc|B\.\s?Sc|\bFrau\b|\bHerr\b)/.test(l) && !/^Praxis\b/i.test(l));
  const plain = lines.find((l) => !skip(l) && !/praxis|zentrum|mvz|psychotherapie|gemeinschaft/i.test(l) && /^[A-ZÄÖÜ][\wäöüß.'-]+(\s+[A-ZÄÖÜ][\wäöüß.'-]+){1,3}$/.test(l));

    </section>
    ${noTimes.length ? `<section class="stack"><h2>Ohne bekannte Telefonzeit</h2><div class="card calllist">${noTimes.map((t) => `<div class="callrow"><div><div class="who">${esc(tName(t))}</div><div class="when">${esc(STATUS[t.status])}</div></div>${callBtn(t)}</div>`).join("")}</div></section>` : ""}

function tickCountdowns() {
  if (!D || route.name !== "anrufen") return;
  const n = nowMin();
  let stale = false;
  $$("[data-until]").forEach((el) => { const m = +el.dataset.until - n; if (m <= 0) stale = true; else el.textContent = "noch " + fmtDur(m); });
  $$("[data-from]").forEach((el) => { const m = +el.dataset.from - n; if (m <= 0) stale = true; else el.textContent = "in " + fmtDur(m); });
  if (stale && !$(".scrim")) render();
}

// ---------- Antrag ----------
const CHECK = [
  ["ptv11", "PTV 11 aus der Sprechstunde", "Am besten mit dem Vermerk „zeitnah erforderlich“. Kopie beilegen, Original behalten."],
  ["absageliste", "Absageliste / Kontaktprotokoll", "Aus dem Protokoll-Bereich drucken. Kassen erwarten oft mehrere dokumentierte Absagen."],
  ["dringlichkeit", "Bescheinigung über die Dringlichkeit", "Zum Beispiel von der Praxis aus der Sprechstunde oder deiner Hausärztin, dass die Behandlung notwendig und dringend ist."],
  ["privat", "Privatpraxis mit Approbation gefunden", "Die Behandler:in muss approbiert sein und ein anerkanntes Verfahren anbieten."],
  ["kostenvoranschlag", "Kostenvoranschlag / Antrag der Privatpraxis", "Mit Verfahren, geplanter Stundenzahl und Kosten pro Sitzung."],
  ["approbation", "Nachweis der Approbation", "Kopie der Approbationsurkunde, meist von der Praxis."],
  ["konsiliar", "Konsiliarbericht (optional)", "Bericht von Hausärztin oder Hausarzt, dass körperliche Ursachen abgeklärt sind. Wird oft ohnehin später gebraucht."],
  ["brief", "Antragsschreiben unterschrieben", "Unten vorbereitet. Prüfen, ergänzen, ausdrucken, unterschreiben."],
  ["kopien", "Von allem Kopien behalten", "Und den Versand nachweisbar machen, z. B. per Einschreiben, Fax mit Sendebericht oder persönlich gegen Eingangsstempel."],
];
function antragFacts() {
  const rows = D.log.filter((l) => l.ergebnis !== "notiz").sort((a, b) => a.ts.localeCompare(b.ts));
  const praxen = new Set(rows.map((r) => r.tid));
  const abs = D.therapists.filter((t) => t.status === "absage");
  const wl = D.therapists.filter((t) => t.status === "warteliste");
  const wochen = wl.map((t) => +t.warteWochen).filter((n) => n > 0);
  const offen = D.therapists.filter((t) => t.status === "angefragt").length;
  return { rows, praxen: praxen.size, abs: abs.length, wl: wl.length, wMin: wochen.length ? Math.min(...wochen) : null, wMax: wochen.length ? Math.max(...wochen) : null, offen, from: rows[0]?.ts, to: rows[rows.length - 1]?.ts };
}
function antragLetter() {
  const i = D.ich, a = D.antrag, f = antragFacts();
  const p = T(a.privatTid);
  const pDesc = p ? `${anredeShort(p)}${tName(p)}${p.praxis && p.name ? ", " + p.praxis : ""}${p.adresse ? ", " + p.adresse : ""}` : "[Name und Anschrift der Privatpraxis]";
  const vf = VERFAHREN_LANG[i.verfahren] || VERFAHREN_LANG.TP;
  const wz = f.wl ? ` und ${plural(f.wl, "Platz auf einer Warteliste", "Plätze auf Wartelisten")}${f.wMin != null ? ` mit Wartezeiten von ${f.wMin === f.wMax ? f.wMin : f.wMin + " bis " + f.wMax} Wochen` : ""}` : "";
  const anlagen = ["Formular PTV 11 (Kopie)", "Aufstellung meiner Kontaktversuche (Absageliste)"];
  if (a.check.dringlichkeit) anlagen.push("Bescheinigung über die Dringlichkeit der Behandlung");
  anlagen.push("Kostenvoranschlag bzw. Antrag der Behandlerin/des Behandlers", "Nachweis der Approbation");
  if (a.check.konsiliar) anlagen.push("Konsiliarbericht");
  return `${i.vollname || i.name || "[Dein Name]"}
${i.adresse || "[Deine Anschrift]"}
${[i.telefon, i.email].filter(Boolean).join(" · ")}

${i.kasse || "[Name der Krankenkasse]"}
${i.kasseAdresse || "[Anschrift der Krankenkasse]"}

Berlin, ${fmtDate(isoDate())}

Antrag auf Kostenerstattung für eine außervertragliche Psychotherapie nach § 13 Abs. 3 SGB V
Versichertennummer: ${i.versNr || "[Versichertennummer]"}${i.geburt ? ", geboren am " + fmtDate(i.geburt) : ""}

Sehr geehrte Damen und Herren,

hiermit beantrage ich die Übernahme der Kosten für eine ambulante Psychotherapie (${vf}) bei ${pDesc} im Wege der Kostenerstattung nach § 13 Abs. 3 SGB V.

${i.sprechstundeDatum ? `Am ${fmtDate(i.sprechstundeDatum)} habe ich eine psychotherapeutische Sprechstunde wahrgenommen${i.sprechstundeBei ? " (" + i.sprechstundeBei + ")" : ""}.` : "Ich habe eine psychotherapeutische Sprechstunde wahrgenommen [Datum ergänzen]."} Dabei wurde festgestellt, dass eine ambulante Psychotherapie notwendig ist${i.zeitnah ? " und zeitnah erforderlich ist" : ""} (siehe beiliegendes Formular PTV 11).

Seitdem habe ich mich intensiv, aber erfolglos um einen Therapieplatz bei Psychotherapeutinnen und Psychotherapeuten mit Kassenzulassung bemüht. ${f.rows.length ? `Zwischen dem ${fmtDate(f.from)} und dem ${fmtDate(f.to)} habe ich ${plural(f.praxen, "Praxis", "Praxen")} kontaktiert (${plural(f.rows.length, "dokumentierter Kontaktversuch", "dokumentierte Kontaktversuche")}). Ich habe ${plural(f.abs, "Absage", "Absagen")}${wz} erhalten${f.offen ? `; ${plural(f.offen, "Praxis hat", "Praxen haben")} bisher nicht geantwortet` : ""}.` : "[Anzahl der kontaktierten Praxen, Absagen und Wartezeiten ergänzen.]"} Eine Aufstellung aller Kontaktversuche liegt bei.${i.tss ? "\n\nAuch über die Terminservicestelle (116117) konnte mir kein Therapieplatz in zumutbarer Zeit vermittelt werden." : ""}

Eine weitere Wartezeit ist mir nicht zumutbar, ${i.dringlichkeit ? "denn: " + i.dringlichkeit : "[hier kurz beschreiben, warum du nicht länger warten kannst. Nur so viel, wie du teilen möchtest.]"}

Da mir die Krankenkasse die notwendige Behandlung nicht rechtzeitig als Sachleistung zur Verfügung stellen kann, bitte ich um Genehmigung der Behandlung bei der oben genannten approbierten Behandlerin bzw. dem oben genannten approbierten Behandler. Bitte teilen Sie mir Ihre Entscheidung innerhalb der Fristen nach § 13 Abs. 3a SGB V schriftlich mit.

Anlagen:
${anlagen.map((x) => "- " + x).join("\n")}

Mit freundlichen Grüßen


${i.vollname || i.name || "[Dein Name]"}`;
}
function anredeShort(t) { return t.anrede === "frau" ? "Frau " : t.anrede === "herr" ? "Herrn " : ""; }
function widerspruchLetter() {
  const i = D.ich, a = D.antrag, f = antragFacts();
  return `${i.vollname || i.name || "[Dein Name]"}
${i.adresse || "[Deine Anschrift]"}

${i.kasse || "[Name der Krankenkasse]"}
${i.kasseAdresse || "[Anschrift der Krankenkasse]"}

Berlin, ${fmtDate(isoDate())}

Widerspruch gegen Ihren Bescheid vom ${a.antwortAm ? fmtDate(a.antwortAm) : "[Datum des Bescheids]"}
Versichertennummer: ${i.versNr || "[Versichertennummer]"}${a.aktenzeichen ? "\nIhr Zeichen: " + a.aktenzeichen : ""}

Sehr geehrte Damen und Herren,

hiermit lege ich Widerspruch gegen Ihren Bescheid vom ${a.antwortAm ? fmtDate(a.antwortAm) : "[Datum]"} ein, mit dem Sie meinen Antrag vom ${a.gestelltAm ? fmtDate(a.gestelltAm) : "[Datum]"} auf Kostenerstattung für eine außervertragliche Psychotherapie nach § 13 Abs. 3 SGB V abgelehnt haben.

Begründung:
Die Behandlung ist notwendig${i.zeitnah ? " und laut PTV 11 zeitnah erforderlich" : ""}. Ich habe mich nachweislich bei ${plural(f.praxen, "Praxis", "Praxen")} mit Kassenzulassung um einen Therapieplatz bemüht und ${plural(f.abs, "Absage", "Absagen")}${f.wl ? ` sowie ${plural(f.wl, "Platz auf einer Warteliste", "Plätze auf Wartelisten")}${f.wMax ? " mit Wartezeiten bis zu " + f.wMax + " Wochen" : ""}` : ""} erhalten. Eine Behandlung innerhalb zumutbarer Zeit war mir als Sachleistung nicht möglich.

[Hier auf die Gründe im Bescheid eingehen. Wenn die Kasse dir Praxen genannt hat: Notiere, ob und wann du dort angefragt hast und mit welchem Ergebnis.]

Ich bitte Sie, Ihre Entscheidung zu überprüfen und mir einen rechtsmittelfähigen Bescheid zu erteilen. Eine ausführlichere Begründung reiche ich gegebenenfalls nach.

Mit freundlichen Grüßen


${i.vollname || i.name || "[Dein Name]"}`;
}
function antragView() {
  const a = D.antrag, f = antragFacts();
  const auto = { ptv11: D.ich.ptv11, absageliste: f.abs > 0 || f.wl > 0, privat: !!a.privatTid };
  const privates = D.therapists.filter((t) => t.typ === "privat" || t.id === a.privatTid);
  const done = CHECK.filter(([k]) => a.check[k] ?? auto[k]).length;
  const frist = a.frist || (a.gestelltAm ? addDays(a.gestelltAm, 21) : "");

  return `<div class="view">

    <p class="note">Allgemeine Hilfe, keine Rechtsberatung. Kassen gehen unterschiedlich damit um. Ruf am besten vorher bei deiner Kasse an und frag, welche Unterlagen sie sehen möchte.</p>

      <label class="field"><span>Privatpraxis für den Antrag</span><select data-change="privatTid"><option value="">Noch keine ausgewählt</option>${privates.map((t) => `<option value="${esc(t.id)}" ${t.id === a.privatTid ? "selected" : ""}>${esc(tName(t))}</option>`).join("")}</select><small>Hier erscheinen Einträge, die in deiner Liste als „Privatpraxis“ markiert sind.</small></label>
    </section>
    <section class="stack">
      <div class="sec-title"><h2>Antragsschreiben</h2></div>
      <p class="small muted">Vorausgefüllt aus deinen Angaben und dem Protokoll. Text in [eckigen Klammern] bitte ersetzen. Deine Änderungen werden gespeichert.</p>
      <textarea class="letter" data-input="brief" aria-label="Antragsschreiben">${esc(brief)}</textarea>
      <div class="row"><button class="btn" data-act="printLetter" data-which="brief">Drucken / als PDF</button><button class="btn ghost" data-act="regenLetter" data-which="brief">Neu aus Daten erzeugen</button></div>
    </section>
    <section class="card stack">
      <h2>Stand des Antrags</h2>
      <div class="grid2">
        <label class="field"><span>Gestellt am</span><input type="date" data-change="antragF" data-k="gestelltAm" value="${esc(a.gestelltAm)}"></label>
        <label class="field"><span>Frist der Kasse</span><input type="date" data-change="antragF" data-k="frist" value="${esc(frist)}"><small>Meist drei Wochen, wenn ein Gutachten eingeholt wird fünf Wochen (§ 13 Abs. 3a SGB V). Die Kasse muss dir Bescheid geben, wenn sie länger braucht.</small></label>
        <label class="field"><span>Antwort</span><select data-change="antragF" data-k="antwort"><option value="">Noch offen</option><option value="genehmigt" ${a.antwort === "genehmigt" ? "selected" : ""}>Genehmigt</option><option value="teilweise" ${a.antwort === "teilweise" ? "selected" : ""}>Teilweise genehmigt</option><option value="abgelehnt" ${a.antwort === "abgelehnt" ? "selected" : ""}>Abgelehnt</option></select></label>
        <label class="field"><span>Bescheid vom</span><input type="date" data-change="antragF" data-k="antwortAm" value="${esc(a.antwortAm)}"></label>
        <label class="field"><span>Widerspruch eingelegt am</span><input type="date" data-change="antragF" data-k="widerspruchAm" value="${esc(a.widerspruchAm)}"></label>
        <label class="field"><span>Aktenzeichen der Kasse</span><input type="text" data-change="antragF" data-k="aktenzeichen" value="${esc(a.aktenzeichen || "")}"></label>
      </div>
      ${a.gestelltAm && !a.antwort && frist ? `<div class="deadline">${daysBetween(isoDate(), frist) >= 0 ? `Die Kasse sollte bis ${fmtDate(frist)} entscheiden (noch ${plural(daysBetween(isoDate(), frist), "Tag", "Tage")}).` : `Die Frist (${fmtDate(frist)}) ist vorbei. Frag bei der Kasse nach, schriftlich ist am besten.`}</div>` : ""}
      ${a.antwort === "genehmigt" ? `<div class="deadline" style="background:var(--sage-soft);color:var(--sage)">Genehmigt. Das hast du dir hart erarbeitet.</div>` : ""}
      ${wFrist && !a.widerspruchAm ? `<div class="deadline">Gegen eine Ablehnung kannst du Widerspruch einlegen, in der Regel innerhalb eines Monats nach Zugang des Bescheids (etwa bis ${fmtDate(wFrist)}). Schau in die Rechtsbehelfsbelehrung im Bescheid.</div>` : ""}
      <label class="field"><span>Notizen (z. B. Gesprächsnotizen mit der Kasse)</span><textarea data-input="antragNotiz" rows="4">${esc(a.notiz)}</textarea></label>

      </div>
    </details>
  </div>`;
}

function openSheet(html, onMount) {
  closeSheet();
  const s = document.createElement("div");
  s.className = "scrim";
  s.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  s.addEventListener("click", (e) => { if (e.target === s) closeSheet(); });
  document.body.appendChild(s);
  document.body.style.overflow = "hidden";
  onMount && onMount(s);
  const f = s.querySelector("[autofocus]");
  if (f && matchMedia("(min-width: 700px)").matches) f.focus();
}

// ---------- Export / Import ----------
function buildExport() {
  save();
  return { app: "therapieplatz", format: 2, exportiert: new Date().toISOString(), daten: D };
}
function download(obj, name) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function importData(text) {
  let obj;
  try { obj = JSON.parse(text); } catch { toast("Die Datei konnte nicht gelesen werden."); return; }
  if (!obj || obj.app !== "therapieplatz" || !obj.daten || typeof obj.daten !== "object") { toast("Das ist keine Sicherung aus dieser App."); return; }
  const go = () => {
    D = normalize(obj.daten);
    save();
    location.hash = "#start";
    render();
    toast("Sicherung importiert.");
  };
  const hasData = D && (D.therapists.length || D.log.length || D.ich.kasse);
  if (hasData) confirmSheet("Daten ersetzen?", "Auf diesem Gerät sind schon Daten. Beim Import werden sie durch die aus der Datei ersetzt.", "Ersetzen", go);
  else go();
}

    closeSheet(); render(); toast("Gespeichert.");
  },
  tpl: (fd, form) => { const t = D.templates.find((x) => x.id === form.dataset.id); t.name = String(fd.get("name")).trim() || "Vorlage"; t.subject = String(fd.get("subject")); t.body = String(fd.get("body")); save(); render(); toast("Vorlage gespeichert."); },
  ich: (fd) => {
    const i = D.ich;
    for (const k of ["sprechstundeDatum", "sprechstundeBei", "verfahren", "kasse", "verfuegbarkeit", "dringlichkeit", "telefon", "email", "vollname", "adresse", "geburt", "versNr", "kasseAdresse"]) i[k] = String(fd.get(k) || "").trim();
    for (const k of ["ptv11", "zeitnah", "tss"]) i[k] = fd.get(k) === "on";
    const n = String(fd.get("name") || "").trim().slice(0, 40);
    if (n) i.name = n;
    save(); location.hash = "#start"; toast("Gespeichert.");
  },
};
document.addEventListener("submit", (e) => {
  const form = e.target.closest("[data-form]");
  if (!form) return;
  e.preventDefault();
  FORM[form.dataset.form]?.(new FormData(form), form);
});

addEventListener("hashchange", () => { parseRoute(); closeSheet(); render(); scrollTo(0, 0); });
addEventListener("storage", (e) => { if (e.key === KEY && !$(".scrim")) { loadAll(); render(); } });
// Rückkehr aus der Telefon-App: offenes Ergebnis-Blatt wieder zeigen
function resumePending() {
  const p = lsGet(LS + ".pending");
  if (!p || !D || Date.now() - p.at > 3 * 3600 * 1000) return;
  if (!$(".scrim") && T(p.tid)) callSheet(p.tid);
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { resumePending(); tickCountdowns(); } });
setInterval(tickCountdowns, 20000);

// ---------- Start ----------
loadAll();
parseRoute();
render();
resumePending();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
